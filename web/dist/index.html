<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>literouter console</title>
    <script>
      // Apply the stored theme before paint, keeping the first frame consistent.
      try {
        const saved = localStorage.getItem('lr.theme');
        const theme = saved === 'light' || saved === 'dark' ? saved : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.classList.add(theme);
        document.documentElement.style.colorScheme = theme;
      } catch {}
    </script>
    <link rel="icon" href="/ui/favicon.svg" type="image/svg+xml" />
    <script type="module" crossorigin src="/ui/app.js"></script>
    <link rel="stylesheet" crossorigin href="/ui/app.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
