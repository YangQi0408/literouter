[package]
namespace   = "literouter"
name        = "gui"
description = "literouter console — the EUI-NEO front end"

[targets.literouter-gui]
kind = "bin"
main = "src/gui_main.cpp"

[dependencies.compat]
eui-neo.workspace = true

[dependencies.literouter]
core = { path = "../core" }

[build]
bmi_schedule = "on"
jobs = "auto"

# On Linux, hide zlib symbols in the main GUI executable so they do not conflict
# with libz.so loaded dynamically by libgio-2.0.so.
[target.linux.build]
ldflags = ["-Wl,--version-script,../../../hide_zlib.ver"]


