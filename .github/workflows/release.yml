# Build and publish the local single-user gateway for Linux, macOS, and Windows.
name: release

on:
  push:
    branches: [main]
    paths:
      - 'docs/release-notes/**.md'
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag, for example v0.3.0'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-release:
    name: Check release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release_notes: ${{ steps.check.outputs.release_notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and release notes
        id: check
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          notes_file=""
          version="$INPUT_VERSION"
          changed_files=""
          changelog_changed=false

          if [ -z "$version" ]; then
            changed_files="$(git diff --name-only "${{ github.event.before || 'HEAD~1' }}" "${{ github.sha }}" || true)"

            if grep -qxF 'CHANGELOG.md' <<< "$changed_files"; then
              changelog_changed=true
              version="$(grep -oE '##[[:space:]]*\[?v?[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -n 1 | grep -oE 'v?[0-9]+\.[0-9]+\.[0-9]+')"
            else
              while IFS= read -r file; do
                [ -n "$file" ] || continue
                if [[ "$file" =~ ^docs/release-notes/(v?[0-9]+\.[0-9]+\.[0-9]+)\.md$ ]]; then
                  version="${BASH_REMATCH[1]}"
                  break
                fi
              done <<< "$changed_files"
            fi
          fi

          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid or missing release version: $version" >&2
            exit 1
          fi
          tag="v$version"

          for candidate in "docs/release-notes/$tag.md" "docs/release-notes/$version.md"; do
            if [ -f "$candidate" ]; then
              notes_file="$candidate"
              break
            fi
          done

          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "tag already exists: $tag" >&2
            exit 1
          fi

          echo "version=$tag" >> "$GITHUB_OUTPUT"
          delimiter="RELEASE_NOTES_${RANDOM}_$(date +%s)"
          {
            echo "release_notes<<$delimiter"
            if [ -n "$notes_file" ] && [ -f "$notes_file" ]; then
              cat "$notes_file"
            elif [ "$changelog_changed" = true ]; then
              awk -v version="$version" '
                /^## \[/ {
                  if (capture) exit
                  heading=$0
                  sub(/^## \[/, "", heading)
                  sub(/\].*/, "", heading)
                  sub(/^v/, "", heading)
                  if (heading == version) capture=1
                }
                capture { print }
              ' CHANGELOG.md
            else
              echo "Release $tag"
            fi
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  build-release:
    name: Build release (${{ matrix.platform }})
    needs: check-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            archive_type: tar
          - os: macos-latest
            platform: macos-arm64
            archive_type: tar
          - os: windows-latest
            platform: windows-x86_64
            archive_type: zip

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mcpp (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://github.com/mcpp-community/mcpp/releases/latest/download/install.sh \
            | MCPP_NO_PATH=1 bash
          echo "$HOME/.mcpp/bin" >> "$GITHUB_PATH"

      - name: Install xlings and mcpp (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://d2learn.org/xlings-install.ps1.txt | iex
          $xlingsBin = "$env:USERPROFILE\.xlings\subos\default\bin"
          $env:PATH = "$xlingsBin;$env:PATH"
          $xlingsBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          xlings install mcpp -y

      - name: Cache mcpp toolchains and dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.mcpp/registry
            ~/.mcpp/build-cache
          key: mcpp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mcpp.toml', '**/mcpp.toml', '**/mcpp.lock') }}
          restore-keys: |
            mcpp-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web console
        run: |
          npm ci --prefix web
          npm run build --prefix web

      - name: Build release binaries
        run: |
          mcpp build -p core --release
          mcpp build -p cli --release

      # The desktop app. It links core, so it builds after it; on Linux it also
      # needs the graphics closure eui-neo pulls, which is why it is a separate
      # step whose failure is visible on its own.
      - name: Build desktop app
        run: mcpp build -p tray --release

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf

      - name: Package release assets
        env:
          VERSION: ${{ needs.check-release.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          ARCHIVE_TYPE: ${{ matrix.archive_type }}
        run: |
          set -euo pipefail
          package="literouter-${VERSION}-${PLATFORM}"
          staging="staging/$package"
          mkdir -p "$staging" dist-release

          if [ "$RUNNER_OS" = "Windows" ]; then
            binary="$(find target -type f -name literouter.exe -path '*/bin/cli/*' | head -n 1)"
            cp "$binary" "$staging/literouter.exe"
            cp "$binary" "dist-release/$package.exe"
            cp "$binary" "dist-release/literouter-windows-x86_64.exe"
            app="$(find target -type f -name literouter-tray.exe -path '*/bin/tray/*' | head -n 1)"
            if [ -n "$app" ]; then
              cp "$app" "$staging/literouter-tray.exe"
            fi
          else
            binary="$(find target -type f -name literouter -path '*/bin/cli/*' | head -n 1)"
            if [ "$RUNNER_OS" = "Linux" ]; then
              python3 scripts/patch_elf_interp.py "$binary"
              patchelf --set-rpath '$ORIGIN' "$binary" 2>/dev/null || true
            fi
            cp "$binary" "$staging/literouter"
            chmod 0755 "$staging/literouter"
            # The desktop app travels with the archive: it is the form most
            # users want, and keeping it beside the CLI binary means one
            # download covers both. Its absence is not fatal — the headless
            # front end does not need it — so a build that skipped it still
            # produces a usable archive.
            app="$(find target -type f -name literouter-tray -path '*/bin/tray/*' | head -n 1)"
            if [ -n "$app" ]; then
              cp "$app" "$staging/literouter-tray"
              chmod 0755 "$staging/literouter-tray"
            fi
            cp "$binary" "dist-release/$package"
            cp "$binary" "dist-release/literouter-$PLATFORM"
          fi

          cp README.md README_en.md LICENSE "$staging/"
          cp scripts/install.sh scripts/install-macos.sh scripts/install-windows.ps1 "$staging/"
          cp NOTICE THIRD_PARTY_NOTICES.md "$staging/" 2>/dev/null || true
          if [ "$ARCHIVE_TYPE" = "zip" ]; then
            (cd staging && 7z a -tzip "../dist-release/$package.zip" "$package")
          else
            (cd staging && tar -czf "../dist-release/$package.tar.gz" "$package")
          fi
          (cd dist-release && for file in *; do
            [ -f "$file" ] || continue
            (sha256sum "$file" 2>/dev/null || shasum -a 256 "$file") > "$file.sha256"
          done)
          ls -lh dist-release

      # A .app bundle and a Windows installer are the forms those two platforms
      # expect a downloadable program to arrive in; the tarball and the zip stay
      # because the install scripts and the container image consume them.
      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ needs.check-release.outputs.version }}
          # Optional: a Developer ID lets the bundle be signed and notarized.
          # Without it the script says so and leaves the bundle ad-hoc signed,
          # which still runs once the user clears the quarantine flag.
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          # The bundle wraps the desktop app, not the CLI: double-clicking a
          # bundle is what the .app exists for, and the CLI has no window to
          # show. The CLI still travels in the tarball beside it.
          binary="$(find target -type f -name literouter-tray -path '*/bin/tray/*' | head -n 1)"
          if [ -z "$binary" ]; then
            echo "the desktop app was not built; skipping the .app bundle" >&2
            exit 0
          fi
          args=(--binary "$binary" --version "$VERSION" --output dist-release)
          if [ -n "${MACOS_SIGN_IDENTITY:-}" ]; then
            args+=(--sign "$MACOS_SIGN_IDENTITY")
          fi
          bash scripts/make_macos_app.sh "${args[@]}"
          # Zipped with ditto, not `zip`: ditto is what preserves the bundle's
          # resource forks and symlinks, and it is what Apple's own tooling
          # produces. A plain `zip -r` of a .app is a known way to ship a bundle
          # that will not launch.
          ditto -c -k --sequesterRsrc --keepParent \
            dist-release/literouter.app \
            "dist-release/literouter-${VERSION}-macos-arm64-app.zip"
          rm -rf dist-release/literouter.app
          # Checksum the one file this step made, by name. A glob in the output
          # redirect would create a file literally called `...-app.zip.sha256`
          # only by accident, and `shasum` prints the path it was given, so the
          # entry has to be relative for `shasum -c` to work from that directory.
          app_zip="literouter-${VERSION}-macos-arm64-app.zip"
          (cd dist-release && shasum -a 256 "$app_zip" > "$app_zip.sha256")
          ls -lh dist-release

      - name: Package Windows installer
        if: runner.os == 'Windows'
        env:
          VERSION: ${{ needs.check-release.outputs.version }}
        run: |
          set -euo pipefail
          binary="$(find target -type f -name literouter.exe -path '*/bin/*' | head -n 1)"
          bash scripts/make_windows_installer.sh --binary "$binary" --version "$VERSION"
          # Only the installer is new here; the .exe and .zip checksums were
          # written by the packaging step above, and rewriting them would be a
          # second, redundant pass over the same files.
          setup="literouter-${VERSION}-windows-x86_64-setup.exe"
          (cd dist-release && (sha256sum "$setup" 2>/dev/null || shasum -a 256 "$setup") > "$setup.sha256")
          ls -lh dist-release

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: dist-release/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [check-release, build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check-release.outputs.version }}
          NOTES: ${{ needs.check-release.outputs.release_notes }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh release create "$TAG" release-assets/* \
            --title "literouter $TAG" \
            --notes "$NOTES"

  # The image, built from the binary this release just published.
  #
  # Deliberately not `docker build .`: that compiles from source inside the
  # image, which costs ~12 minutes of toolchain download and fails outright when
  # a fetch crosses xlings' ten-minute deadline. The binary is already built,
  # already relocatable (patch_elf_interp.py plus `patchelf --set-rpath
  # '$ORIGIN'`), and already attached to the release, so this downloads it and
  # sets BINARY_SOURCE=prebuilt to package it as-is. 22 seconds instead of 12
  # minutes, and nothing left to time out.
  #
  # Runs after publish-release because it consumes the release asset rather than
  # the build-release artifact: that is the exact file users download, so the
  # image and the release cannot drift apart.
  publish-image:
    name: Publish container image
    needs: [check-release, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the published Linux binary
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check-release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p prebuilt
          gh release download "$TAG" --pattern 'literouter-linux-x86_64' --dir prebuilt
          mv prebuilt/literouter-linux-x86_64 prebuilt/literouter
          chmod 0755 prebuilt/literouter
          ./prebuilt/literouter --version

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.check-release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.check-release.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            BINARY_SOURCE=prebuilt
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
