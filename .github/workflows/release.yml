# Automated Release Workflow — triggered when a release note document is updated,
# performing multi-platform release builds, bundling artifacts, tagging, and publishing.
name: release

on:
  push:
    branches: [main]
    paths:
      - 'docs/release-notes/**.md'
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.0)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-release:
    name: Check release notes & determine version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      release_notes: ${{ steps.check.outputs.release_notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse release note and check tag existence
        id: check
        shell: bash
        run: |
          set -euo pipefail

          INPUT_VER="${{ github.event.inputs.version }}"
          NOTES_FILE=""
          TARGET_VER=""

          if [ -n "$INPUT_VER" ]; then
            TARGET_VER="$INPUT_VER"
            if [ -f "docs/release-notes/${TARGET_VER}.md" ]; then
              NOTES_FILE="docs/release-notes/${TARGET_VER}.md"
            elif [ -f "docs/release-notes/${TARGET_VER#v}.md" ]; then
              NOTES_FILE="docs/release-notes/${TARGET_VER#v}.md"
            fi
          else
            # Detect changed files in the push
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before || 'HEAD~1' }} ${{ github.sha }} || true)
            echo "Changed files:"
            echo "$CHANGED_FILES"

            for file in $CHANGED_FILES; do
              if [[ "$file" =~ ^docs/release-notes/.*\.md$ ]] && [ -f "$file" ]; then
                NOTES_FILE="$file"
                # Extract version from filename or title
                fname=$(basename "$file" .md)
                if [[ "$fname" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
                  TARGET_VER="$fname"
                  [[ "$TARGET_VER" =~ ^v ]] || TARGET_VER="v$TARGET_VER"
                fi
                break
              elif [ "$file" = "CHANGELOG.md" ] && [ -f "$file" ]; then
                NOTES_FILE="CHANGELOG.md"
                # Parse latest version from CHANGELOG.md (e.g. ## [0.1.0] or ## v0.1.0)
                ver=$(grep -oE '##\s*\[?v?[0-9]+\.[0-9]+\.[0-9]+' "$file" | head -n 1 | grep -oE 'v?[0-9]+\.[0-9]+\.[0-9]+')
                if [ -n "$ver" ]; then
                  [[ "$ver" =~ ^v ]] || ver="v$ver"
                  TARGET_VER="$ver"
                fi
                break
              fi
            done
          fi

          if [ -z "$TARGET_VER" ]; then
            echo "No valid release version determined from changes."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          [[ "$TARGET_VER" =~ ^v ]] || TARGET_VER="v$TARGET_VER"
          echo "Target version: $TARGET_VER"

          # Check if tag already exists in remote
          if git rev-parse -q --verify "refs/tags/$TARGET_VER" >/dev/null; then
            echo "Tag $TARGET_VER already exists in repository. Skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Prepare release notes content
          BODY=""
          if [ -n "$NOTES_FILE" ] && [ -f "$NOTES_FILE" ]; then
            BODY=$(cat "$NOTES_FILE")
          else
            BODY="Release $TARGET_VER"
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$TARGET_VER" >> "$GITHUB_OUTPUT"
          {
            echo "release_notes<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-release:
    name: build release (${{ matrix.platform }})
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            archive_type: tar
          - os: macos-latest
            platform: macos-arm64
            archive_type: tar
          - os: windows-latest
            platform: windows-x86_64
            archive_type: zip

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mcpp (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://github.com/mcpp-community/mcpp/releases/latest/download/install.sh \
            | MCPP_NO_PATH=1 bash
          echo "$HOME/.mcpp/bin" >> "$GITHUB_PATH"

      - name: Install xlings and mcpp (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://d2learn.org/xlings-install.ps1.txt | iex
          $xlingsBin = "$env:USERPROFILE\.xlings\subos\default\bin"
          $env:PATH = "$xlingsBin;$env:PATH"
          $xlingsBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          xlings install mcpp -y

      - name: Cache mcpp toolchains and dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.mcpp/registry
            ~/.mcpp/build-cache
          key: mcpp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mcpp.toml', '**/mcpp.toml', '**/mcpp.lock') }}
          restore-keys: |
            mcpp-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build web console
        run: |
          npm ci --prefix web
          npm run build --prefix web

      - name: Build release binaries
        run: |
          mcpp build -p core --release
          mcpp build -p cli --release
          # Build GUI on Linux and Windows; on macOS ignore zlib shared linking issue
          if [ "${{ runner.os }}" = "macOS" ]; then
            mcpp build -p gui --release || true
          else
            mcpp build -p gui --release
          fi

      - name: Package release assets
        run: |
          set -euo pipefail
          VER="${{ needs.check-release.outputs.version }}"
          PKG_NAME="literouter-${VER}-${{ matrix.platform }}"
          STAGING="staging/${PKG_NAME}"
          mkdir -p "$STAGING" dist-release

          # Copy binaries
          find cli/target -type f \( -name "literouter" -o -name "literouter.exe" \) -exec cp {} "$STAGING/" \;
          find gui/target -type f \( -name "literouter-gui" -o -name "literouter-gui.exe" \) -exec cp {} "$STAGING/" \; 2>/dev/null || true
          find gui/target -type f -name "*.dll" -exec cp {} "$STAGING/" \; 2>/dev/null || true

          # Copy documentation and license
          cp README.md "$STAGING/" 2>/dev/null || true
          cp README_en.md "$STAGING/" 2>/dev/null || true
          cp LICENSE "$STAGING/" 2>/dev/null || true
          cp NOTICE "$STAGING/" 2>/dev/null || true
          cp THIRD_PARTY_NOTICES.md "$STAGING/" 2>/dev/null || true

          # Archive
          if [ "${{ matrix.archive_type }}" = "zip" ]; then
            ARCHIVE="${PKG_NAME}.zip"
            (cd staging && zip -r -9 "../dist-release/${ARCHIVE}" "${PKG_NAME}")
          else
            ARCHIVE="${PKG_NAME}.tar.gz"
            (cd staging && tar -czf "../dist-release/${ARCHIVE}" "${PKG_NAME}")
          fi

          # Compute SHA-256
          (cd dist-release && sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256")

          ls -lh dist-release/

      - name: Upload release artifact to workflow
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: dist-release/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [check-release, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Tag commit and push tag
        env:
          TAG: ${{ needs.check-release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-release.outputs.version }}
          name: literouter ${{ needs.check-release.outputs.version }}
          body: ${{ needs.check-release.outputs.release_notes }}
          files: release-assets/*
          draft: false
          prerelease: false
