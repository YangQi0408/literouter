name: refresh-release-image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing latest release tag whose current CLI asset is packaged'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: refresh-release-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify published CLI
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh release view --json tagName --jq .tagName)" = "$VERSION"
          mkdir prebuilt
          gh release download "$VERSION" --pattern literouter-linux-x86_64 --pattern literouter-linux-x86_64.sha256 --dir prebuilt
          (cd prebuilt && sha256sum -c literouter-linux-x86_64.sha256)
          mv prebuilt/literouter-linux-x86_64 prebuilt/literouter
          chmod 755 prebuilt/literouter
          test "$(./prebuilt/literouter --version)" = "${VERSION#v}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: BINARY_SOURCE=prebuilt
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
