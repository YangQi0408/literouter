# macOS CI — same shape as ci-linux, with one difference: the GUI is built but
# not smoke-run. Its smoke mode opens a real window (GLFW/OpenGL), and a CI
# runner has no interactive session to open one into; the Linux lane carries
# the exercised GUI.
name: ci-macos

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build + test (macos arm64)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Same documented installer as the Linux lane; it supports macOS arm64.
      - name: Install mcpp
        run: |
          curl -fsSL https://github.com/mcpp-community/mcpp/releases/latest/download/install.sh \
            | MCPP_NO_PATH=1 bash
          echo "$HOME/.mcpp/bin" >> "$GITHUB_PATH"

      - name: Cache mcpp toolchains and dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.mcpp/registry
            ~/.mcpp/build-cache
          key: mcpp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mcpp.toml', '**/mcpp.toml', '**/mcpp.lock') }}
          restore-keys: |
            mcpp-${{ runner.os }}-${{ runner.arch }}-

      - name: Version and toolchain report
        run: |
          mcpp --version
          mcpp self env

      - name: Build core
        run: mcpp build -p core
      - name: Build cli
        run: mcpp build -p cli
      - name: Build gui
        run: mcpp build -p gui

      - name: Test core
        run: mcpp test -p core

      - name: CLI smoke test
        run: |
          mcpp run -p cli -- --version
          mcpp run -p cli -- config init --force
          mcpp run -p cli -- config validate

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: literouter-macos-arm64
          if-no-files-found: error
          path: |
            cli/target/**/bin/literouter
            gui/target/**/bin/literouter-gui
