# literouter via docker compose.
#
#   docker compose up -d
#   docker compose logs -f
#   docker compose exec literouter literouter status
#
# Two volumes, and the split matters: `config` holds the keys and is what you
# edit and back up, while `state` holds the telemetry file and the client quota
# ledger. Putting the ledger on an anonymous volume would mean every
# `docker compose down -v` hands every client a fresh day's quota.
services:
  literouter:
    build:
      context: .
      # Uncomment to build against a base whose glibc is known good on your
      # host, e.g. when tracking a newer Debian.
      # args:
      #   RUNTIME_BASE: debian:trixie-slim
    image: literouter:local
    container_name: literouter
    restart: unless-stopped
    # Published to the host's loopback on purpose. The console at /ui can read
    # the request log, which carries prompts, so exposing it on 0.0.0.0 without
    # an api_key is a decision an operator should make deliberately rather than
    # inherit from a compose file.
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - literouter-config:/etc/literouter
      - literouter-state:/var/lib/literouter
    # Environment references inside the config are resolved at request time, so
    # a key can live here instead of in the config file. Nothing is written back.
    environment:
      LITEROUTER_LANG: ${LITEROUTER_LANG:-auto}
      # OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY or edit the config}
      # RELAY_API_KEY: ${RELAY_API_KEY}
    # The container is not privileged, drops every capability and cannot gain
    # new ones: it needs a listening socket and outbound HTTPS, nothing else.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # A relay that streams a long answer can idle for minutes between tokens, so
    # the stop timeout has to be generous or docker will SIGKILL mid-stream.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "literouter", "status", "--json", "--quiet"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  literouter-config:
  literouter-state:
