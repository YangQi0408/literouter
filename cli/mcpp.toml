[package]
namespace   = "literouter"
name        = "cli"
description = "literouter — the command-line front end"

[targets.literouter]
kind = "bin"
main = "src/cli_main.cpp"

[dependencies.literouter]
core = { path = "../core" }

[dependencies.compat]
# CLI11 is header-only in this index: the include root is `*/include`, so the
# spelling below is `<CLI/CLI.hpp>`. It is the only direct dependency the CLI
# needs — `status` and `logs` both go through core's admin client
# (fetchStatus/fetchLogs), so this front end never reaches for httplib itself.
CLI11 = { workspace = true }

[build]
bmi_schedule = "on"
jobs = "auto"

# `cli/tests/*.cpp` includes `cli/src/cli_ui.hpp` to reach the pure helpers the
# CLI's own output goes through (visibleWidth, stripAnsi, the table renderer),
# and `core/tests/lr_test_check.h` for the assertion macros. Both are on the
# include path rather than spelled as relative paths in every file, and the
# assertion header is the core one rather than a copy — a second copy would
# drift the moment either side gained a macro.
include_dirs = ["src", "../core/tests"]

