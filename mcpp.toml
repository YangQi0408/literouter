# literouter — one local AI endpoint that fans out to every relay you configured.
#
# Virtual workspace: the root produces no artifact. Three members:
#   core/  literouter.core  — config, routing, proxy engine (library)
#   cli/   literouter.cli   — the `literouter` command (binary)
#   tray/  literouter.tray  — the desktop app: tray icon, embedded gateway
#
# `mcpp build` at the root builds all three; `mcpp test` runs every member's
# tests; `mcpp run -p cli -- serve` drives the headless front end.
#
# `tray` is a member rather than a standalone project because it links
# literouter.core to run the gateway in its own process — and core's manifest
# uses `workspace = true` for its dependency pins, which mcpp only resolves for
# packages inside the workspace that declares them. The cost is that a
# workspace build now pulls eui-neo's graphics closure (GLFW, OpenGL, freetype,
# libpng, glib/gio); the benefit is that the tray has no platform-specific
# process management at all, which is what makes it one implementation instead
# of three.
[workspace]
members = ["core", "cli", "tray"]

# clang + libc++ is the toolchain mcpp builds the `std` PCM for; clangd consumes
# that at target/<triple>/<hash>/pcm.cache/std.pcm, so the editor and the build
# agree on one module graph.
[toolchain]
default = "llvm@22.1.8"

[workspace.package]
version = "0.4.0"
license = "Apache-2.0"
authors = ["literouter contributors"]

# Declared once here; members opt in with `.workspace = true`, so a security
# bump to httplib is one edit rather than two.
[workspace.dependencies.compat]
httplib = "0.53.1"
CLI11   = "2.7.2"

[workspace.dependencies.nlohmann]
json = "3.12.0"
