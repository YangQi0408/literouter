# literouter — one local AI endpoint that fans out to every relay you configured.
#
# Virtual workspace: the root produces no artifact. Two members:
#   core/  literouter.core  — config, routing, proxy engine (library)
#   cli/   literouter.cli   — the `literouter` command (binary)
#
# `mcpp build` at the root builds both; `mcpp test` runs every member's tests;
# `mcpp run -p cli -- serve` drives the single front end.
[workspace]
members = ["core", "cli"]

# clang + libc++ is the toolchain mcpp builds the `std` PCM for; clangd consumes
# that at target/<triple>/<hash>/pcm.cache/std.pcm, so the editor and the build
# agree on one module graph.
[toolchain]
default = "llvm@22.1.8"

[workspace.package]
version = "0.1.0"
license = "Apache-2.0"
authors = ["literouter contributors"]

# Declared once here; members opt in with `.workspace = true`, so a security
# bump to httplib is one edit rather than two.
[workspace.dependencies.compat]
httplib = "0.53.1"
CLI11   = "2.7.2"

[workspace.dependencies.nlohmann]
json = "3.12.0"
